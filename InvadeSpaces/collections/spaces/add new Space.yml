info:
  name: add new Space
  type: http
  seq: 2

http:
  method: POST
  url: localhost:8080/spaces
  body:
    type: json
    data: |-
      {
        "name": "sala gimnastyczna",
        "capacity": 100
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response is 200", () => {
            expect(res.getStatus()).to.equal(200)
        })

        test("expect some id", () => {
            expect(res.body).to.have.property("id")
        })

        test("response is in json", () => {
            expect(res.getBody()).to.have.jsonBody()
        })
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.name
        method: jsonq
      variable:
        name: name
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
