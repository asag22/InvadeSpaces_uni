info:
  name: get space by name
  type: http
  seq: 3

http:
  method: GET
  url: localhost:8080/spaces?name={{name}}
  params:
    - name: name
      value: "{{name}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response is 200", () => {
            expect(res.getStatus()).to.equal(200)
        })

        test("response is in json", () => {
            expect(res.getBody()).to.have.jsonBody()
        })

        test("response is an array", () => {
            expect(res.getBody()).to.be.an("array")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
