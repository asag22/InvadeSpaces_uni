info:
  name: update Space
  type: http
  seq: 4

http:
  method: PUT
  url: localhost:8080/spaces/{{id}}
  body:
    type: json
    data: |-
      {
        "name": "szatnia",
        "capacity": 13
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response is 200", () => {
            expect(res.getStatus()).to.equal(200)
        })

        test("response is in json", () => {
            expect(res.getBody()).to.have.jsonBody()
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
