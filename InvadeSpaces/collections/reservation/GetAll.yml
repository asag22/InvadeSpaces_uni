info:
  name: GetAll
  type: http
  seq: 1

http:
  method: GET
  url: localhost:8080/reservations
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body[0].id
        method: jsonq
      variable:
        name: id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
